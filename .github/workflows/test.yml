name: Test

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install function dependencies
        run: python -m pip install -r function/requirements.txt
      - name: Compile function sources
        run: python -m py_compile function/job_command.py function/submit_hadoop_job.py
      - name: Run unit tests
        run: python -m unittest discover -s test -p 'test_*.py' -v
